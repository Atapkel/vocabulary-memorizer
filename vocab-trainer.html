<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word Box</title>
<style>
  :root{
    --paper:#EFE9DC;
    --card:#FBF8F1;
    --ink:#262220;
    --ink-soft:#6b6255;
    --line:#D9D0BC;
    --moss:#4C6A44;
    --moss-bg:#E1E9DA;
    --ochre:#A9781F;
    --ochre-bg:#F1E4C6;
    --brick:#A8402F;
    --brick-bg:#F2DAD3;
    --slate:#3E5C76;
    --slate-bg:#DCE5EC;
    --serif: 'Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif;
    --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
  }
  .wrap{
    max-width:600px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  header h1{
    font-family:var(--serif);
    font-size:22px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
  }
  nav{ display:flex; gap:18px; }
  nav button{
    background:none;
    border:none;
    font-family:var(--sans);
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    padding:4px 0;
    border-bottom:2px solid transparent;
  }
  nav button.active{
    color:var(--ink);
    border-bottom:2px solid var(--ink);
    font-weight:600;
  }
  .stats-row{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .stat{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    padding:8px 12px;
    flex:1;
  }
  .stat b{
    display:block;
    font-family:var(--serif);
    font-size:20px;
    color:var(--ink);
    font-weight:600;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:26px 24px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:5px;
    background:var(--state-color, var(--slate));
  }
  .badge{
    display:inline-block;
    font-size:11px;
    text-transform:lowercase;
    padding:2px 8px;
    border-radius:2px;
    color:var(--state-color, var(--slate));
    background:var(--state-bg, var(--slate-bg));
    margin-bottom:14px;
  }
  .pos{
    font-style:italic;
    color:var(--ink-soft);
    font-size:14px;
    margin-left:8px;
  }
  .word{
    font-family:var(--serif);
    font-size:34px;
    font-weight:600;
    margin:0 0 6px 0;
  }
  .context{
    font-size:15px;
    line-height:1.55;
    color:var(--ink-soft);
    margin:16px 0;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .context b{ color:var(--ink); font-weight:600; }
  .reveal-block{ margin-top:16px; }
  .field-label{
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:3px;
  }
  .field{ margin-bottom:14px; }
  .translation{
    font-family:var(--serif);
    font-size:20px;
    font-weight:600;
  }
  .explanation, .example{
    font-size:14px;
    line-height:1.5;
    color:var(--ink);
  }
  .synonyms{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .syn-tag{
    font-size:12px;
    border:1px solid var(--line);
    border-radius:2px;
    padding:2px 8px;
    color:var(--ink-soft);
  }
  .action-btn{
    width:100%;
    padding:13px;
    margin-top:10px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:3px;
    font-family:var(--sans);
    font-size:15px;
    cursor:pointer;
  }
  .action-btn:hover{ opacity:0.9; }
  .rate-row{
    display:flex;
    gap:8px;
    margin-top:20px;
  }
  .rate-btn{
    flex:1;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:3px;
    padding:10px 4px;
    cursor:pointer;
    font-family:var(--sans);
    text-align:center;
  }
  .rate-btn .label{ font-size:13px; font-weight:600; }
  .rate-btn .time{ font-size:11px; color:var(--ink-soft); display:block; margin-top:2px; }
  .rate-again .label{ color:var(--brick); }
  .rate-hard .label{ color:var(--ochre); }
  .rate-good .label{ color:var(--moss); }
  .rate-easy .label{ color:var(--slate); }
  .rate-btn:hover{ background:var(--paper); }
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty .word{ font-size:26px; }
  .lib-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 4px;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .lib-row .lw{ font-family:var(--serif); font-size:17px; }
  .lib-row .lm{ color:var(--ink-soft); font-size:12px; }
  .lib-del{
    background:none;border:none;color:var(--brick);cursor:pointer;font-size:12px;
  }
  textarea{
    width:100%;
    min-height:180px;
    font-family:monospace;
    font-size:12px;
    padding:12px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--card);
    color:var(--ink);
    resize:vertical;
  }
  .msg{ font-size:13px; margin-top:10px; color:var(--ink-soft); }
  .add-help{ font-size:13px; color:var(--ink-soft); margin-bottom:10px; line-height:1.5; }
  .reset-link{
    background:none;border:none;color:var(--brick);font-size:12px;cursor:pointer;
    margin-top:24px; text-decoration:underline; padding:0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Word Box</h1>
    <nav>
      <button id="nav-review" class="active" onclick="setView('review')">Review</button>
      <button id="nav-library" onclick="setView('library')">Library</button>
      <button id="nav-add" onclick="setView('add')">Add</button>
    </nav>
  </header>
  <div id="stats" class="stats-row"></div>
  <div id="main"></div>
</div>

<script>
const STORAGE_KEY = 'vocab-data';
const LEARNING_STEPS_MIN = [1, 10];

const SAMPLE_WORDS = [
  {
    "id": "c00f0975b7951",
    "word": "plentiful",
    "context": "There is also a plentiful of educational theory about the university, but commonly it focuses on the university as a form of education or as a pedagogical place, while higher education teaching is not explicitly developed.",
    "translation": "мол, молшылық; көп",
    "explanation": "Бір нәрсенің санының өте көп екенін білдіреді. Бұл контексте білім беру теорияларының өте көп екені айтылып тұр.",
    "created_at": 1789317479317,
    "pos": "adjective",
    "synonyms": "abundant, ample",
    "example": "The library has plentiful resources for students."
  },
  {
    "id": "ccabc3c64141a",
    "word": "vivid",
    "context": "However, it is possible to both question the system and create room for pedagogical thinking in the educational work of higher education teachers, to create room for reflection on the choices we make within our teaching, and this room can be informed by the vivid and interesting field of educational theory and pedagogical philosophy.",
    "translation": "жарқын, айқын, әсерлі",
    "explanation": "Бір нәрсенің өте анық, әсерлі және есте қаларлық екенін білдіреді. Бұл жерде білім беру теориясының қызықты әрі мазмұнды саласын сипаттайды.",
    "created_at": 1789317479317,
    "pos": "adjective",
    "synonyms": "lively, striking",
    "example": "She gave a vivid description of her first day at university."
  }
];

let state = { words: [], reviews: {} };
let currentView = 'review';
let currentWord = null;
let revealed = false;
let loaded = false;

function newReview(){
  return { state:'new', step:0, interval:0, ef:2.5, due: Date.now(), reps:0, lapses:0 };
}

async function loadData(){
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    if (res && res.value) state = JSON.parse(res.value);
  } catch(e) {
    state = { words: [], reviews: {} };
  }
  if (!state.words) state.words = [];
  if (!state.reviews) state.reviews = {};
  if (state.words.length === 0) {
    state.words = SAMPLE_WORDS.slice();
  }
  state.words.forEach(w => {
    if (!state.reviews[w.id]) state.reviews[w.id] = newReview();
  });
  loaded = true;
  await saveData();
}

async function saveData(){
  try {
    const ok = await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    if (!ok) console.error('Storage set returned null');
  } catch(e) {
    console.error('Storage error', e);
  }
}

function rate(review, rating){
  const now = Date.now();
  const r = Object.assign({}, review);
  if (r.state === 'new' || r.state === 'learning') {
    if (rating === 'again') {
      r.state = 'learning'; r.step = 0; r.lapses++;
      r.due = now + LEARNING_STEPS_MIN[0]*60000;
    } else if (rating === 'hard') {
      r.state = 'learning';
      const cur = LEARNING_STEPS_MIN[Math.min(r.step, LEARNING_STEPS_MIN.length-1)];
      r.due = now + Math.round(cur*1.5)*60000;
    } else if (rating === 'good') {
      const nextStep = r.step + 1;
      if (nextStep >= LEARNING_STEPS_MIN.length) {
        r.state = 'review'; r.interval = 1; r.reps = 1; r.due = now + 1*86400000;
      } else {
        r.state = 'learning'; r.step = nextStep;
        r.due = now + LEARNING_STEPS_MIN[nextStep]*60000;
      }
    } else if (rating === 'easy') {
      r.state = 'review'; r.interval = 4; r.reps = 1; r.due = now + 4*86400000;
    }
  } else {
    const qmap = { again:2, hard:3, good:4, easy:5 };
    const q = qmap[rating];
    if (q < 3) {
      r.lapses++; r.reps = 0; r.state = 'learning'; r.step = 0;
      r.ef = Math.max(1.3, r.ef - 0.2);
      r.due = now + LEARNING_STEPS_MIN[0]*60000;
    } else {
      r.reps += 1;
      if (r.reps === 1) r.interval = 1;
      else if (r.reps === 2) r.interval = 6;
      else r.interval = Math.round(r.interval * r.ef);
      r.ef = Math.max(1.3, r.ef + (0.1 - (5-q)*(0.08+(5-q)*0.02)));
      r.due = now + r.interval*86400000;
    }
  }
  return r;
}

function formatDelta(ms){
  const min = Math.round(ms/60000);
  if (min < 60) return min + 'm';
  const hrs = Math.round(min/60);
  if (hrs < 24) return hrs + 'h';
  const days = Math.round(hrs/24);
  return days + 'd';
}

function dueWords(){
  const now = Date.now();
  return state.words
    .filter(w => state.reviews[w.id].due <= now)
    .sort((a,b) => state.reviews[a.id].due - state.reviews[b.id].due);
}

function counts(){
  const now = Date.now();
  const c = { total: state.words.length, dueNow: 0, learning: 0, review: 0, newc: 0 };
  state.words.forEach(w => {
    const r = state.reviews[w.id];
    if (r.state === 'new') c.newc++;
    else if (r.state === 'learning') c.learning++;
    else c.review++;
    if (r.due <= now) c.dueNow++;
  });
  return c;
}

function stateColor(s){
  if (s === 'new') return { c:'var(--slate)', bg:'var(--slate-bg)' };
  if (s === 'learning') return { c:'var(--ochre)', bg:'var(--ochre-bg)' };
  return { c:'var(--moss)', bg:'var(--moss-bg)' };
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function highlightContext(context, word){
  const idx = context.toLowerCase().indexOf(word.toLowerCase());
  if (idx === -1) return escapeHtml(context);
  const before = context.slice(0, idx);
  const match = context.slice(idx, idx+word.length);
  const after = context.slice(idx+word.length);
  return escapeHtml(before) + '<b>' + escapeHtml(match) + '</b>' + escapeHtml(after);
}

function renderStats(){
  const c = counts();
  document.getElementById('stats').innerHTML = `
    <div class="stat">New<b>${c.newc}</b></div>
    <div class="stat">Learning<b>${c.learning}</b></div>
    <div class="stat">Review<b>${c.review}</b></div>
    <div class="stat">Due now<b>${c.dueNow}</b></div>
  `;
}

function setView(v){
  currentView = v;
  revealed = false;
  currentWord = null;
  document.getElementById('nav-review').classList.toggle('active', v==='review');
  document.getElementById('nav-library').classList.toggle('active', v==='library');
  document.getElementById('nav-add').classList.toggle('active', v==='add');
  render();
}

function pickNextCard(){
  const due = dueWords();
  currentWord = due.length ? due[0] : null;
}

function renderReview(){
  if (currentWord === null) pickNextCard();
  const main = document.getElementById('main');
  if (!currentWord) {
    const now = Date.now();
    let nextDue = null;
    state.words.forEach(w => {
      const d = state.reviews[w.id].due;
      if (d > now && (nextDue === null || d < nextDue)) nextDue = d;
    });
    main.innerHTML = `
      <div class="card"><div class="empty">
        <p class="word">All caught up</p>
        <p>${nextDue ? 'Next word is due in ' + formatDelta(nextDue-now) + '.' : 'Add more words in the Add tab.'}</p>
      </div></div>`;
    return;
  }
  const w = currentWord;
  const r = state.reviews[w.id];
  const sc = stateColor(r.state);
  let html = `<div class="card" style="--state-color:${sc.c};--state-bg:${sc.bg}">
    <span class="badge">${r.state}</span><span class="pos">${escapeHtml(w.pos||'')}</span>
    <p class="word">${escapeHtml(w.word)}</p>
    <div class="context">${highlightContext(w.context, w.word)}</div>`;

  if (!revealed) {
    html += `<button class="action-btn" onclick="reveal()">Show answer</button>`;
  } else {
    html += `<div class="reveal-block">
      <div class="field"><div class="field-label">Translation</div><div class="translation">${escapeHtml(w.translation||'')}</div></div>
      ${w.explanation ? `<div class="field"><div class="field-label">Explanation</div><div class="explanation">${escapeHtml(w.explanation)}</div></div>` : ''}
      ${w.example ? `<div class="field"><div class="field-label">Example</div><div class="example">${escapeHtml(w.example)}</div></div>` : ''}
      ${w.synonyms ? `<div class="field"><div class="field-label">Synonyms</div><div class="synonyms">${w.synonyms.split(',').map(s=>`<span class="syn-tag">${escapeHtml(s.trim())}</span>`).join('')}</div></div>` : ''}
    </div>`;
    const previews = {
      again: rate(r,'again').due - Date.now(),
      hard: rate(r,'hard').due - Date.now(),
      good: rate(r,'good').due - Date.now(),
      easy: rate(r,'easy').due - Date.now(),
    };
    html += `<div class="rate-row">
      <button class="rate-btn rate-again" onclick="submitRating('again')"><span class="label">Again</span><span class="time">${formatDelta(previews.again)}</span></button>
      <button class="rate-btn rate-hard" onclick="submitRating('hard')"><span class="label">Hard</span><span class="time">${formatDelta(previews.hard)}</span></button>
      <button class="rate-btn rate-good" onclick="submitRating('good')"><span class="label">Good</span><span class="time">${formatDelta(previews.good)}</span></button>
      <button class="rate-btn rate-easy" onclick="submitRating('easy')"><span class="label">Easy</span><span class="time">${formatDelta(previews.easy)}</span></button>
    </div>`;
  }
  html += `</div>`;
  main.innerHTML = html;
}

function reveal(){
  revealed = true;
  render();
}

async function submitRating(rating){
  const w = currentWord;
  state.reviews[w.id] = rate(state.reviews[w.id], rating);
  await saveData();
  revealed = false;
  currentWord = null;
  render();
}

function renderLibrary(){
  const main = document.getElementById('main');
  if (state.words.length === 0) {
    main.innerHTML = `<div class="card"><div class="empty">No words yet. Add some in the Add tab.</div></div>`;
    return;
  }
  const rows = state.words.map(w => {
    const r = state.reviews[w.id];
    const due = r.due <= Date.now() ? 'due now' : 'due in ' + formatDelta(r.due - Date.now());
    return `<div class="lib-row">
      <div><span class="lw">${escapeHtml(w.word)}</span><br><span class="lm">${escapeHtml(r.state)} · ${due}</span></div>
      <button class="lib-del" onclick="deleteWord('${w.id}')">Remove</button>
    </div>`;
  }).join('');
  main.innerHTML = `<div class="card">${rows}</div>`;
}

async function deleteWord(id){
  state.words = state.words.filter(w => w.id !== id);
  delete state.reviews[id];
  await saveData();
  render();
}

function renderAdd(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <p class="add-help">Paste a JSON array of words in the same format (id, word, context, translation, explanation, pos, synonyms, example). Words with an id you already have will be skipped.</p>
      <textarea id="import-text" placeholder="[ { &quot;id&quot;: ..., &quot;word&quot;: ... } ]"></textarea>
      <button class="action-btn" onclick="importWords()">Import words</button>
      <div class="msg" id="import-msg"></div>
      <button class="reset-link" onclick="resetProgress()">Reset all progress</button>
    </div>
  `;
}

async function importWords(){
  const text = document.getElementById('import-text').value;
  const msg = document.getElementById('import-msg');
  let parsed;
  try {
    parsed = JSON.parse(text);
    if (!Array.isArray(parsed)) throw new Error('Not an array');
  } catch(e) {
    msg.textContent = 'Could not parse JSON: ' + e.message;
    return;
  }
  let added = 0, skipped = 0;
  parsed.forEach(w => {
    if (!w.id || !w.word) { skipped++; return; }
    if (state.words.find(x => x.id === w.id)) { skipped++; return; }
    state.words.push(w);
    state.reviews[w.id] = newReview();
    added++;
  });
  await saveData();
  msg.textContent = `Added ${added} word${added===1?'':'s'}, skipped ${skipped}.`;
  document.getElementById('import-text').value = '';
}

async function resetProgress(){
  state.words.forEach(w => { state.reviews[w.id] = newReview(); });
  await saveData();
  document.getElementById('import-msg').textContent = 'All progress reset.';
}

function render(){
  renderStats();
  if (currentView === 'review') renderReview();
  else if (currentView === 'library') renderLibrary();
  else renderAdd();
}

(async function init(){
  await loadData();
  render();
})();
</script>
</body>
</html>
